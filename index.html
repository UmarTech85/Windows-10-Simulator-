<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Windows 10 Simulator</title>
    <meta name="description" content="An authentic, interactive Windows 10 desktop simulator complete with Start Menu, Live Tiles, File Explorer, Edge browser, Command Prompt, MS Paint, Notepad, Calculator, Minesweeper, Task Manager, Settings, sound effects, and Aero Snap." />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#0078d7" />
    <meta name="color-scheme" content="dark light" />

    <!-- Web App & OS Simulator Display -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Windows 10" />
    <meta name="application-name" content="Windows 10 Simulator" />
    <meta name="msapplication-TileColor" content="#0078d7" />

    <!-- OpenGraph Social Cards -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Windows 10 Simulator" />
    <meta property="og:description" content="An authentic, interactive Windows 10 desktop simulator complete with Start Menu, Live Tiles, File Explorer, Edge browser, Command Prompt, MS Paint, Notepad, Calculator, Minesweeper, Task Manager, Settings, sound effects, and Aero Snap." />
    <meta property="og:site_name" content="Windows 10 Simulator" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Windows 10 Simulator" />
    <meta name="twitter:description" content="An authentic, interactive Windows 10 desktop simulator complete with Start Menu, Live Tiles, File Explorer, Edge browser, Command Prompt, MS Paint, Notepad, Calculator, Minesweeper, Task Manager, Settings, sound effects, and Aero Snap." />

    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Windows 10 Simulator",
      "applicationCategory": "OperatingSystemSimulator",
      "operatingSystem": "Web Browser",
      "description": "An authentic, interactive Windows 10 desktop simulator complete with Start Menu, Live Tiles, File Explorer, Edge browser, Command Prompt, MS Paint, Notepad, Calculator, Minesweeper, Task Manager, Settings, sound effects, and Aero Snap.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
  </head>
  <body class="bg-black overflow-hidden select-none">
    <div id="root">
      <!-- Windows 10 Initial Boot Screen (shown until React mounts) -->
      <div style="position:fixed;inset:0;background:#000000;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ffffff;font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;z-index:9999;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 88" width="72" height="72" style="margin-bottom:56px;">
          <path fill="#00adef" d="M0,12.402l35.689-4.863v34.423H0V12.402z M0,46.002h35.689v34.423L0,75.562V46.002z M40.049,6.974L88,0.362v41.601H40.049V6.974z M40.049,46.002H88v41.601l-47.951-6.611V46.002z"/>
        </svg>
        <div style="width:36px;height:36px;border:3px solid transparent;border-top-color:#ffffff;border-radius:50%;animation:win10spin 1s linear infinite;"></div>
        <style>
          @keyframes win10spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
